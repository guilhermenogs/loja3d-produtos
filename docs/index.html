<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Loja 3D</title>
  <meta name="description" content="Peças impressas em 3D">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1 id="nome">Minha Loja 3D</h1>
      <p id="slogan"></p>
    </header>

    <main id="grid" class="grid" aria-live="polite"></main>

    <footer>
      <span id="rodape"></span>
    </footer>
  </div>

  <dialog id="modal">
    <button class="close" id="fechar" aria-label="Fechar">✕</button>
    <div class="scroll">
      <div class="ph"><img id="m-img" alt=""></div>
      <div class="thumbs" id="m-thumbs" hidden></div>
      <div class="body">
        <h2 id="m-nome"></h2>
        <div class="preco" id="m-preco"></div>
        <p class="desc" id="m-desc"></p>
      </div>
    </div>
    <div class="acoes">
      <a class="btn block" id="m-conversa" target="_blank" rel="noopener" hidden>Abrir conversa no Messenger</a>
      <button class="btn ghost block" id="m-copiar" type="button">Copiar nome do produto</button>
      <p class="hint" id="m-dica">Cole o nome na nossa conversa do Marketplace para eu separar o seu.</p>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
